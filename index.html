<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>When Is Test Cricket On Next</title>
<meta name="description" content="The next Test match — or two — and when they start." />
<meta property="og:title" content="When is Test cricket on next?" />
<meta property="og:description" content="The next scheduled Test match — countdown, venue, and how to watch." />
<meta property="og:image" content="https://whenistestcricketonnext.com/og-image.png" />
<meta property="og:url" content="https://whenistestcricketonnext.com/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="When is Test cricket on next?" />
<meta name="twitter:description" content="The next scheduled Test match — countdown, venue, and how to watch." />
<meta name="twitter:image" content="https://whenistestcricketonnext.com/og-image.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏏</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --pavilion: #17332a;
    --pavilion-deep: #0e211b;
    --cream: #f2ead4;
    --cream-dim: #cfc4a4;
    --ball: #b3272c;
    --gold: #c8a35a;
    --rule: rgba(242, 234, 212, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--pavilion);
    color: var(--cream);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100%;
  }
  body {
    background-image:
      radial-gradient(ellipse at top, rgba(200, 163, 90, 0.10), transparent 55%),
      linear-gradient(var(--pavilion), var(--pavilion-deep));
    display: flex; flex-direction: column; align-items: center;
    padding: 3rem 1.25rem 4rem;
  }
  .wrap { width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 2.75rem; }
  .kicker { font-size: 0.8rem; letter-spacing: 0.04em; color: var(--gold); margin: 0 0 0.6rem; }
  .today { font-size: 0.85rem; color: var(--cream-dim); margin: 0.9rem 0 0; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(2.1rem, 6vw, 3.1rem); line-height: 1.08;
    margin: 0; letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; color: var(--ball); }
  #status { text-align: center; color: var(--cream-dim); padding: 3rem 0; font-size: 0.95rem; }
  .matches { display: flex; flex-direction: column; gap: 1.5rem; }
  .match {
    border: 1px solid var(--rule); border-radius: 2px;
    padding: 1.75rem 1.75rem 1.5rem;
    background: linear-gradient(180deg, rgba(242,234,212,0.035), rgba(242,234,212,0.01));
    position: relative;
  }
  .match::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--gold);
  }
  .teams {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(1.3rem, 4vw, 1.65rem); margin: 0 0 0.9rem; letter-spacing: -0.01em;
  }
  .teams .vs { color: var(--cream-dim); font-style: italic; font-weight: 400; font-size: 0.75em; margin: 0 0.35em; }
  .countdown-row {
    display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem;
    margin: 0 0 1.1rem; padding-bottom: 1.1rem; border-bottom: 1px solid var(--rule);
  }
  .countdown-num { font-family: 'Fraunces', serif; font-size: clamp(5rem, 20vw, 8rem); font-weight: 700; color: var(--gold); line-height: 1; }
  .countdown-label { color: var(--cream-dim); font-size: 1.6rem; }
  .countdown-row.live .countdown-num { color: var(--ball); }
  dl.details { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.55rem 1rem; font-size: 0.92rem; }
  dl.details dt { color: var(--cream-dim); }
  dl.details dd { margin: 0; }
  footer { margin-top: 3rem; text-align: center; color: var(--cream-dim); font-size: 0.8rem; opacity: 0.75; }
  .upcoming-wrap { margin-top: 2.5rem; }
  .upcoming-heading {
    font-family: 'Fraunces', serif; font-weight: 600; font-style: italic;
    font-size: 1.1rem; color: var(--gold); margin: 0 0 0.9rem;
  }
  .upcoming-list { list-style: none; margin: 0; padding: 0; }
  .upcoming-list li {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.7rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.9rem;
  }
  .upcoming-list li:last-child { border-bottom: none; }
  .upcoming-teams { font-weight: 500; }
  .upcoming-date { color: var(--cream-dim); text-align: right; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) {
    .match { animation: rise 0.5s ease-out both; }
    .match:nth-child(2) { animation-delay: 0.08s; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="kicker">whenistestcricketonnext.com</p>
      <h1>When is Test cricket <em>on</em> next?</h1>
      <p id="today" class="today"></p>
    </header>

    <div id="status" hidden>No Test match currently scheduled. Check back soon.</div>
    <div id="matches" class="matches"></div>

    <div id="upcoming-wrap" class="upcoming-wrap" hidden>
      <h2 class="upcoming-heading">Coming up after that</h2>
      <ul id="upcoming-list" class="upcoming-list"></ul>
    </div>

    <footer>Schedule updates automatically · times shown in your local timezone</footer>
  </div>

<script>
  // The fixtures come from data/schedule.json, which a GitHub job refreshes
  // every hour from CricketData.org (see scripts/update-schedule.mjs).
  //
  // HAND_EDITS is for the things CricketData doesn't know or gets wrong.
  // Each entry is matched to a Test by home team, away team and start date
  // (within two days). Use the team names exactly as the site shows them,
  // with " (w)" for women's teams.
  //   watch: { home, away, uk } — channels in the home country, the away
  //                                country and UK/Ireland (leave out any not known)
  //   broadcaster:  "..."         — a single line of text instead
  //   start:        "...Z"          — corrects CricketData's start time (GMT)
  //   hide: true                    — removes a Test from the site
  const HAND_EDITS = [
    { home: "South Africa", away: "Australia", date: "2026-10-18",
      watch: { home: "SuperSport", away: "Fox Cricket / Kayo Sports", uk: "Sky Sports" } },
    { home: "South Africa", away: "Australia", date: "2026-10-27",
      watch: { home: "SuperSport", away: "Fox Cricket / Kayo Sports", uk: "Sky Sports" } },
    { home: "South Africa", away: "England", date: "2026-12-17", broadcaster: "Sky Sports Cricket" },
    { home: "South Africa", away: "England", date: "2026-12-26", broadcaster: "Sky Sports Cricket" },
    { home: "South Africa", away: "England", date: "2027-01-03", broadcaster: "Sky Sports Cricket" },
    // CricketData has the MCG Boxing Day Test at 11:30 GMT on 26 Dec; it starts 10:30 local, 23:30 GMT on 25 Dec.
    { home: "Australia", away: "New Zealand", date: "2026-12-26", start: "2026-12-25T23:30:00Z" }
  ];
  const SHORT_NAMES = {
    "Afghanistan": "AFG", "Australia": "AUS", "Bangladesh": "BAN", "England": "ENG",
    "India": "IND", "Ireland": "IRE", "New Zealand": "NZ", "Pakistan": "PAK",
    "South Africa": "SA", "Sri Lanka": "SL", "West Indies": "WI", "Zimbabwe": "ZIM"
  };
  function shortName(team) {
    var plain = team.replace(/\s*\(w\)$/, '');
    return SHORT_NAMES[plain] || plain;
  }
  const DEFAULT_BROADCASTER = "UK/Ireland broadcaster not yet confirmed — check listings nearer the time";

  // Safety net if the hourly update ever stops: drop a Test this long after its start.
  const MATCH_DURATION_MS = (4 * 24 + 10) * 60 * 60 * 1000;
  const CONCURRENT_WINDOW_MS = 4 * 24 * 60 * 60 * 1000;
  const DAY_MS = 24 * 60 * 60 * 1000;

  var statusEl = document.getElementById('status');
  var matchesEl = document.getElementById('matches');

  function fmtDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function countdown(m) {
    var diff = new Date(m.start).getTime() - Date.now();
    if (diff <= 0 || m.started) return { live: true };
    var days = Math.ceil(diff / 86400000);
    if (days > 0) return { live: false, num: days, label: days === 1 ? 'day to go' : 'days to go' };
    var hours = Math.ceil(diff / 3600000);
    return { live: false, num: hours, label: hours === 1 ? 'hour to go' : 'hours to go' };
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function renderMatch(m) {
    var cd = countdown(m);
    var el = document.createElement('article');
    el.className = 'match';

    var row = document.createElement('div');
    row.className = 'countdown-row' + (cd.live ? ' live' : '');
    row.innerHTML = cd.live
      ? '<span class="countdown-num">Live</span><span class="countdown-label">match in progress</span>'
      : '<span class="countdown-num">' + cd.num + '</span><span class="countdown-label">' + cd.label + '</span>';
    el.appendChild(row);

    var teams = document.createElement('p');
    teams.className = 'teams';
    teams.innerHTML = escapeHtml(m.home) + '<span class="vs">v</span>' + escapeHtml(m.away);
    el.appendChild(teams);

    var dl = document.createElement('dl');
    dl.className = 'details';
    function addRow(term, desc) {
      var dt = document.createElement('dt'); dt.textContent = term;
      var dd = document.createElement('dd'); dd.textContent = desc;
      dl.appendChild(dt); dl.appendChild(dd);
    }
    addRow('Starts', fmtDate(m.start) + ', ' + fmtTime(m.start));
    if (m.venue) addRow('Venue', m.venue);
    if (m.series) addRow('Series', m.series);
    if (m.watch) {
      var w = m.watch;
      var parts = [];
      if (w.home) parts.push(shortName(m.home) + ': ' + w.home);
      if (w.away) parts.push(shortName(m.away) + ': ' + w.away);
      if (w.uk) parts.push('UK/Ire: ' + w.uk);
      addRow('Watch on', parts.join(' · '));
    } else {
      addRow('Watch on', m.broadcaster || DEFAULT_BROADCASTER);
    }
    el.appendChild(dl);
    return el;
  }

  function applyHandEdits(m) {
    var startMs = new Date(m.start).getTime();
    for (var i = 0; i < HAND_EDITS.length; i++) {
      var e = HAND_EDITS[i];
      if (e.home !== m.home || e.away !== m.away) continue;
      if (Math.abs(new Date(e.date + 'T12:00:00Z').getTime() - startMs) > 2 * DAY_MS) continue;
      if (e.hide) return null;
      if (e.start) m.start = e.start;
      if (e.watch) m.watch = e.watch;
      if (e.broadcaster) m.broadcaster = e.broadcaster;
    }
    if (/^TBC(,\s*TBC)?$/i.test(m.venue || '')) m.venue = 'TBC';
    return m;
  }

  function render(schedule) {
    var now = Date.now();
    var upcoming = schedule
      .map(applyHandEdits)
      .filter(function (m) { return m && !m.ended && new Date(m.start).getTime() + MATCH_DURATION_MS > now; })
      .sort(function (a, b) { return new Date(a.start) - new Date(b.start); });

    var selected = [];
    if (upcoming.length) {
      var soonest = new Date(upcoming[0].start).getTime();
      selected = upcoming
        .filter(function (m) { return new Date(m.start).getTime() - soonest <= CONCURRENT_WINDOW_MS; })
        .slice(0, 2);
    }

    if (!selected.length) {
      statusEl.hidden = false;
    } else {
      selected.forEach(function (m) { matchesEl.appendChild(renderMatch(m)); });
    }

    var rest = upcoming.filter(function (m) { return selected.indexOf(m) === -1; });
    if (rest.length) {
      var upcomingWrap = document.getElementById('upcoming-wrap');
      var upcomingList = document.getElementById('upcoming-list');
      rest.slice(0, 5).forEach(function (m) {
        var li = document.createElement('li');
        var teamsSpan = document.createElement('span');
        teamsSpan.className = 'upcoming-teams';
        teamsSpan.textContent = m.home + ' v ' + m.away;
        var dateSpan = document.createElement('span');
        dateSpan.className = 'upcoming-date';
        dateSpan.textContent = new Date(m.start).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
        li.appendChild(teamsSpan);
        li.appendChild(dateSpan);
        upcomingList.appendChild(li);
      });
      upcomingWrap.hidden = false;
    }
  }

  document.getElementById('today').textContent = 'Today: ' + new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  fetch('data/schedule.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { render(data.matches || []); })
    .catch(function () {
      statusEl.textContent = "Couldn't load the schedule just now. Please try refreshing.";
      statusEl.hidden = false;
    });
</script>
</body>
</html>
