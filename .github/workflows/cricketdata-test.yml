name: CricketData test (does not touch the site)

on:
  push:
    branches: [cricketdata-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cricketdata-test
      - name: Ask CricketData what it knows
        env:
          KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: |
          set -u
          mkdir -p test-output
          if [ -z "$KEY" ]; then echo "NO KEY FOUND" > test-output/ERROR.txt; else
            get () { curl -sS --max-time 30 "https://api.cricapi.com/v1/$1apikey=$KEY" | sed "s/$KEY/REDACTED/g" | jq . > "test-output/$2.json" || echo "failed: $2" >> test-output/ERROR.txt; }
            get "series?offset=0&" series-all-p0
            get "series?offset=25&" series-all-p1
            get "series?offset=0&search=tour%20of%20India&" series-tour-of-india-p0
            get "series?offset=25&search=tour%20of%20India&" series-tour-of-india-p1
            get "series?offset=0&search=Women&" series-women-p0
          fi
      - name: Save results to this test branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add test-output
          git commit -m "CricketData test output" || echo "nothing to commit"
          git push
